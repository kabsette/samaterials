<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satisfactory Calculator</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Custom animation for the slow spinner */
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin-slow 3s linear infinite;
        }
        /* Scrollbar styling for the summary lists */
        .scrollbar-thin::-webkit-scrollbar {
            width: 6px;
        }
        .scrollbar-thin::-webkit-scrollbar-track {
            background: #374151; 
            border-radius: 4px;
        }
        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: #4b5563; 
            border-radius: 4px;
        }
        .scrollbar-thin::-webkit-scrollbar-thumb:hover {
            background: #6b7280; 
        }
    </style>
</head>
<body class="bg-gray-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- ICONS (Converted to SVG components) ---
        const IconBase = ({ children, size = 24, className = "", fill = "none" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );
        
        const ChevronRight = (p) => <IconBase {...p}><path d="m9 18 6-6-6-6"/></IconBase>;
        const ChevronDown = (p) => <IconBase {...p}><path d="m6 9 6 6 6-6"/></IconBase>;
        const Package = (p) => <IconBase {...p}><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22v-9"/></IconBase>;
        const AlertTriangle = (p) => <IconBase {...p}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></IconBase>;
        const Settings = (p) => <IconBase {...p}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.39a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></IconBase>;
        const RefreshCw = (p) => <IconBase {...p}><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></IconBase>;
        const Calculator = (p) => <IconBase {...p}><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></IconBase>;
        const CheckCircle = (p) => <IconBase {...p}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></IconBase>;
        const XCircle = (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></IconBase>;
        const Loader2 = (p) => <IconBase {...p} className={`${p.className} animate-spin`}><path d="M21 12a9 9 0 1 1-6.219-8.56"/></IconBase>;
        const Layers = (p) => <IconBase {...p}><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></IconBase>;
        const Zap = (p) => <IconBase {...p}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" /></IconBase>;
        // Added Wrench Icon
        const Wrench = (p) => <IconBase {...p}><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" /></IconBase>;


        // --- DATA & CONFIGURATION ---

        const RAW_STOPS = new Set([
            "Desc_OreIron_C",
            "Desc_OreCopper_C",
            "Desc_Stone_C",      
            "Desc_Coal_C",
            "Desc_RawQuartz_C",
            "Desc_Sulfur_C",
            "Desc_LiquidOil_C",
            "Desc_Water_C",
            "Desc_NitrogenGas_C",
            "Desc_SAM_C",
            "Desc_OreBauxite_C",
            "Desc_OreUranium_C",
            "Desc_OreGold_C"    
        ]);

        const BUILDING_POWER = {
            "Desc_OilPump_C": 40,
            "Desc_FrackingSmasher_C": 150, // Resource Well Pressurizer
            "Desc_WaterPump_C": 20,
            "Desc_MinerMk1_C": 5,
            "Desc_MinerMk2_C": 12,
            "Desc_MinerMk3_C": 30,
            "Desc_FoundryMk1_C": 16,
            "Desc_SmelterMk1_C": 4,
            "Desc_AssemblerMk1_C": 15,
            "Desc_ManufacturerMk1_C": 55,
            "Desc_Blender_C": 75,
            "Desc_Packager_C": 10,
            "Desc_HadronCollider_C": 1500, // Particle Accelerator
            "Desc_ConstructorMk1_C": 4,
            "Desc_OilRefinery_C": 30
        };

        const DEFAULT_RECIPE_DATA = {
            "Recipe_IngotIron_C": [{
                "className": "Recipe_IngotIron_C",
                "name": "Iron Ingot",
                "duration": 2,
                "ingredients": [{ "item": "Desc_OreIron_C", "amount": 1 }],
                "products": [{ "item": "Desc_IronIngot_C", "amount": 1 }],
                "producedIn": ["Desc_SmelterMk1_C"],
                "alternate": false
            }],
            "Recipe_IngotCopper_C": [{
                "className": "Recipe_IngotCopper_C",
                "name": "Copper Ingot",
                "duration": 2,
                "ingredients": [{ "item": "Desc_OreCopper_C", "amount": 1 }],
                "products": [{ "item": "Desc_CopperIngot_C", "amount": 1 }],
                "producedIn": ["Desc_SmelterMk1_C"],
                "alternate": false
            }],
            "Recipe_Wire_C": [{
                "className": "Recipe_Wire_C",
                "name": "Wire",
                "duration": 4,
                "ingredients": [{ "item": "Desc_CopperIngot_C", "amount": 1 }],
                "products": [{ "item": "Desc_Wire_C", "amount": 2 }],
                "producedIn": ["Desc_ConstructorMk1_C"],
                "alternate": false
            }],
            "Recipe_Cable_C": [{
                "className": "Recipe_Cable_C",
                "name": "Cable",
                "duration": 2,
                "ingredients": [{ "item": "Desc_Wire_C", "amount": 2 }],
                "products": [{ "item": "Desc_Cable_C", "amount": 1 }],
                "producedIn": ["Desc_ConstructorMk1_C"],
                "alternate": false
            }],
            "Recipe_IronPlate_C": [{
                "className": "Recipe_IronPlate_C",
                "name": "Iron Plate",
                "duration": 6,
                "ingredients": [{ "item": "Desc_IronIngot_C", "amount": 3 }],
                "products": [{ "item": "Desc_IronPlate_C", "amount": 2 }],
                "producedIn": ["Desc_ConstructorMk1_C"],
                "alternate": false
            }],
            "Recipe_IronRod_C": [{
                "className": "Recipe_IronRod_C",
                "name": "Iron Rod",
                "duration": 4,
                "ingredients": [{ "item": "Desc_IronIngot_C", "amount": 1 }],
                "products": [{ "item": "Desc_IronRod_C", "amount": 1 }],
                "producedIn": ["Desc_ConstructorMk1_C"],
                "alternate": false
            }]
        };

        // --- LOGIC HELPERS ---

        const cleanName = (id) => id.replace("Desc_", "").replace("_C", "").replace(/([A-Z])/g, ' $1').trim();

        const calculateNode = (itemId, requiredRate, visited, productToRecipe, idToName) => {
            const itemName = idToName[itemId] || cleanName(itemId);
            
            // 1. Check Hard Stops
            if (RAW_STOPS.has(itemId)) {
                return {
                    id: itemId,
                    name: itemName,
                    rate: requiredRate,
                    type: 'raw',
                    power: 0,
                    machineCount: 0,
                    machineName: null,
                    children: []
                };
            }

            // 2. Check Loop
            if (visited.has(itemId)) {
                return {
                    id: itemId,
                    name: itemName,
                    rate: requiredRate,
                    type: 'loop',
                    power: 0,
                    machineCount: 0,
                    machineName: null,
                    children: []
                };
            }

            // 3. Find Recipe
            const recipe = productToRecipe[itemId];
            if (!recipe) {
                // Treat as raw material if no recipe found
                return {
                    id: itemId,
                    name: itemName,
                    rate: requiredRate,
                    type: 'raw', // Or 'missing'
                    power: 0,
                    machineCount: 0,
                    machineName: null,
                    children: []
                };
            }

            const newVisited = new Set(visited);
            newVisited.add(itemId);

            // Calculate Scale & Power
            const productEntry = recipe.products.find(p => p.item === itemId);
            const baseRate = (productEntry.amount / recipe.duration) * 60;
            const scale = requiredRate / baseRate; 
            
            let stepPower = 0;
            let machineId = null;
            let machineName = null;

            if (recipe.producedIn && recipe.producedIn.length > 0) {
                machineId = recipe.producedIn[0]; // Default to the first machine listed
                machineName = cleanName(machineId);
                const basePower = BUILDING_POWER[machineId] || 0;
                stepPower = scale * basePower;
            }

            // Build Children
            const children = recipe.ingredients.map(ing => {
                const ingRate = (ing.amount / recipe.duration) * 60 * scale;
                return calculateNode(ing.item, ingRate, newVisited, productToRecipe, idToName);
            });

            return {
                id: itemId,
                name: itemName,
                rate: requiredRate,
                type: 'normal',
                recipeName: recipe.name,
                power: stepPower,
                machineCount: scale,
                machineName: machineName,
                children: children
            };
        };

        // --- COMPONENTS ---

        const TreeNode = ({ node, depth = 0 }) => {
            const isLeaf = node.children.length === 0;
            
            let rateColor = "text-orange-400";
            let bgColor = "bg-gray-800/50";
            let borderColor = "border-l-gray-600";
            
            if (node.type === 'raw') {
                rateColor = "text-red-400";
                bgColor = "bg-red-900/10";
                borderColor = "border-l-red-500/50";
            } else if (node.type === 'loop') {
                rateColor = "text-yellow-400";
                bgColor = "bg-yellow-900/10";
                borderColor = "border-l-yellow-500/50";
            }

            return (
                <div className={`ml-4 pl-4 border-l ${borderColor} mt-1`}>
                    <details open className="group">
                        <summary className={`flex items-center p-2 rounded cursor-pointer hover:bg-gray-700 transition-colors list-none ${bgColor}`}>
                            <div className="flex items-center gap-2 flex-1 flex-wrap">
                                {!isLeaf ? (
                                    <ChevronRight className="w-4 h-4 text-gray-500 group-open:rotate-90 transition-transform" />
                                ) : (
                                    <div className="w-4" /> 
                                )}
                                
                                <div className="flex flex-col sm:flex-row sm:items-center sm:gap-2 mr-auto">
                                    <span className={`font-mono font-bold ${rateColor}`}>
                                        {node.rate.toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 2 })}/min
                                    </span>
                                    <span className="font-semibold text-gray-200">
                                        {node.name}
                                    </span>
                                </div>
                                
                                {/* Stats Area */}
                                <div className="flex items-center gap-3 text-xs sm:text-sm">
                                    {/* Machine Count Display (if normal node) */}
                                    {node.type === 'normal' && node.machineCount > 0 && (
                                        <span className="text-gray-400 bg-gray-900/50 px-2 py-0.5 rounded font-mono flex items-center gap-1">
                                            <span className="font-bold text-white">{node.machineCount.toFixed(2)}x</span> 
                                            {node.machineName || "Mch"}
                                        </span>
                                    )}

                                    {/* Power Display */}
                                    {node.power > 0 && (
                                        <div className="flex items-center gap-1 text-yellow-500 bg-yellow-900/20 px-2 py-0.5 rounded border border-yellow-800/30">
                                            <Zap size={12} fill="currentColor" />
                                            <span className="font-mono font-bold">{node.power.toLocaleString(undefined, { maximumFractionDigits: 1 })} MW</span>
                                        </div>
                                    )}
                                </div>

                                {node.type === 'raw' && (
                                    <span className="ml-2 text-xs bg-red-900/50 text-red-300 px-2 py-0.5 rounded border border-red-800">RAW</span>
                                )}
                                {node.type === 'loop' && (
                                    <span className="ml-2 text-xs bg-yellow-900/50 text-yellow-300 px-2 py-0.5 rounded border border-yellow-800">LOOP</span>
                                )}
                            </div>
                        </summary>
                        
                        {node.children.length > 0 && (
                            <div className="pt-1">
                                {node.children.map((child, idx) => (
                                    <TreeNode key={`${child.id}-${idx}`} node={child} depth={depth + 1} />
                                ))}
                            </div>
                        )}
                    </details>
                </div>
            );
        };

        const App = () => {
            const [targetItem, setTargetItem] = useState('');
            const [targetRate, setTargetRate] = useState(60);
            const [treeData, setTreeData] = useState(null);
            const [items, setItems] = useState([]);
            const [loadedData, setLoadedData] = useState(DEFAULT_RECIPE_DATA);
            const [dataStatus, setDataStatus] = useState('loading'); 
            
            useEffect(() => {
                const fetchData = async () => {
                    try {
                        const response = await fetch('./recipes.json');
                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }
                        const json = await response.json();
                        setLoadedData(json);
                        setDataStatus('success');
                    } catch (e) {
                        console.warn("Could not load local recipes.json, falling back to default data.", e);
                        setDataStatus('error'); 
                    }
                };

                fetchData();
            }, []);

            const { productToRecipe, nameToId, idToName } = useMemo(() => {
                const prodMap = {};
                const nToId = {};
                const idToN = {};

                Object.values(loadedData).forEach(recipeList => {
                    recipeList.forEach(recipe => {
                        if (recipe.alternate) return; 

                        if (recipe.products && recipe.products.length > 0) {
                            const itemId = recipe.products[0].item;
                            
                            if (!prodMap[itemId]) {
                                prodMap[itemId] = recipe;
                            }

                            const friendlyName = recipe.name || cleanName(itemId);
                            nToId[friendlyName] = itemId;
                            idToN[itemId] = friendlyName;

                            recipe.ingredients.forEach(ing => {
                                if (!idToN[ing.item]) {
                                    idToN[ing.item] = cleanName(ing.item);
                                }
                            });
                        }
                    });
                });
                return { productToRecipe: prodMap, nameToId: nToId, idToName: idToN };
            }, [loadedData]);

            useEffect(() => {
                const sortedNames = Object.keys(nameToId).sort();
                setItems(sortedNames);
                
                if (!targetItem || !nameToId[targetItem]) {
                    if (sortedNames.length > 0) {
                        if (sortedNames.includes("Iron Plate")) setTargetItem("Iron Plate");
                        else setTargetItem(sortedNames[0]);
                    } else {
                        setTargetItem('');
                    }
                }
            }, [nameToId]);

            const handleCalculate = (e) => {
                e.preventDefault();
                if (!targetItem || !nameToId[targetItem]) return;

                const itemId = nameToId[targetItem];
                const tree = calculateNode(itemId, parseFloat(targetRate), new Set(), productToRecipe, idToName);
                setTreeData(tree);
            };

            // --- Calculate Totals (Raw Materials, Power & Buildings) ---
            const { rawTotals, totalPower, buildingTotals } = useMemo(() => {
                if (!treeData) return { rawTotals: null, totalPower: 0, buildingTotals: null };

                const totals = {};
                const buildings = {};
                let powerSum = 0;

                const traverse = (node) => {
                    // Sum Power
                    if (node.power) {
                        powerSum += node.power;
                    }

                    // Sum Buildings
                    if (node.machineCount > 0 && node.machineName) {
                        if (!buildings[node.machineName]) {
                            buildings[node.machineName] = 0;
                        }
                        buildings[node.machineName] += node.machineCount;
                    }

                    // If node is a raw material, add to totals
                    if (node.type === 'raw') {
                        if (!totals[node.id]) {
                        totals[node.id] = { name: node.name, rate: 0 };
                        }
                        totals[node.id].rate += node.rate;
                    }
                    
                    if (node.children && node.children.length > 0) {
                        node.children.forEach(traverse);
                    }
                };

                traverse(treeData);

                // Sort buildings by count descending
                const sortedBuildings = Object.entries(buildings)
                    .map(([name, count]) => ({ name, count }))
                    .sort((a, b) => b.count - a.count);

                return { 
                    rawTotals: Object.values(totals).sort((a, b) => b.rate - a.rate),
                    totalPower: powerSum,
                    buildingTotals: sortedBuildings
                };
            }, [treeData]);

            return (
                <div className="min-h-screen bg-gray-900 text-gray-100 font-sans selection:bg-orange-500 selection:text-white pb-20">
                    <header className="bg-gray-800 border-b border-gray-700 p-6 shadow-lg">
                        <div className="max-w-4xl mx-auto flex flex-col md:flex-row md:items-center justify-between gap-4">
                            <div className="flex items-center gap-3">
                                <div className="bg-orange-500 p-2 rounded-lg text-gray-900">
                                    <Calculator size={24} strokeWidth={2.5} />
                                </div>
                                <div>
                                    <h1 className="text-2xl font-bold tracking-tight text-white">
                                        Satisfactory <span className="text-orange-500">Calculator</span>
                                    </h1>
                                    <p className="text-gray-400 text-sm">Production chain visualizer</p>
                                </div>
                            </div>

                            <div className="flex items-center gap-3">
                                {dataStatus === 'loading' && (
                                    <div className="flex items-center gap-2 text-yellow-400 bg-yellow-900/30 px-3 py-2 rounded-lg border border-yellow-800">
                                        <Loader2 size={18} className="animate-spin" />
                                        <span className="text-sm font-medium">Fetching recipes.json...</span>
                                    </div>
                                )}
                                
                                {dataStatus === 'success' && (
                                    <div className="flex items-center gap-2 text-green-400 bg-green-900/30 px-3 py-2 rounded-lg border border-green-800">
                                        <CheckCircle size={18} />
                                        <span className="text-sm font-medium">Remote Data Loaded</span>
                                    </div>
                                )}

                                {dataStatus === 'error' && (
                                    <div className="flex items-center gap-2 text-gray-400 bg-gray-800 px-3 py-2 rounded-lg border border-gray-700" title="Could not find recipes.json, using fallback data.">
                                        <XCircle size={18} />
                                        <span className="text-sm font-medium">Using Default Data</span>
                                    </div>
                                )}
                            </div>
                        </div>
                    </header>

                    <main className="max-w-4xl mx-auto p-6 space-y-8">
                        
                        {/* Input Card */}
                        <div className="bg-gray-800 rounded-xl p-6 border border-gray-700 shadow-xl">
                            <form onSubmit={handleCalculate} className="flex flex-col md:flex-row gap-6 items-end">
                                <div className="flex-1 w-full">
                                    <label className="block text-xs font-semibold text-gray-400 uppercase mb-2 tracking-wider">
                                        Target Product
                                    </label>
                                    <div className="relative">
                                        <select 
                                            value={targetItem}
                                            onChange={(e) => setTargetItem(e.target.value)}
                                            className="w-full bg-gray-900 border border-gray-600 rounded-lg py-3 px-4 text-white appearance-none focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-all cursor-pointer"
                                        >
                                            {items.length === 0 ? (
                                                <option>No items found</option>
                                            ) : (
                                                items.map(name => (
                                                    <option key={name} value={name}>{name}</option>
                                                ))
                                            )}
                                        </select>
                                        <ChevronDown className="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 pointer-events-none" size={16} />
                                    </div>
                                </div>

                                <div className="w-full md:w-48">
                                    <label className="block text-xs font-semibold text-gray-400 uppercase mb-2 tracking-wider">
                                        Rate (per min)
                                    </label>
                                    <input 
                                        type="number" 
                                        value={targetRate}
                                        onChange={(e) => setTargetRate(e.target.value)}
                                        step="0.1"
                                        min="0"
                                        className="w-full bg-gray-900 border border-gray-600 rounded-lg py-3 px-4 text-white focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-all font-mono"
                                    />
                                </div>

                                <button 
                                    type="submit"
                                    className="w-full md:w-auto bg-orange-600 hover:bg-orange-500 text-white font-bold py-3 px-8 rounded-lg transition-colors flex items-center justify-center gap-2 shadow-lg shadow-orange-900/20"
                                >
                                    <RefreshCw size={18} />
                                    Calculate
                                </button>
                            </form>
                        </div>

                        {/* --- Summaries --- */}
                        {treeData && (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            
                            {/* Power Summary Card */}
                            <div className="bg-gray-800 rounded-xl p-6 border border-gray-700 shadow-xl flex flex-col justify-center items-center relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-full h-1 bg-yellow-500/50"></div>
                                <Zap size={32} className="text-yellow-500 mb-2" fill="currentColor" />
                                <h2 className="text-sm font-bold uppercase text-gray-400 tracking-wider">Total Energy</h2>
                                <p className="text-3xl font-mono font-bold text-white mt-1">
                                    {totalPower.toLocaleString(undefined, { maximumFractionDigits: 1 })} <span className="text-base font-normal text-yellow-500">MW</span>
                                </p>
                            </div>

                            {/* Building Summary Card */}
                            <div className="bg-gray-800 rounded-xl p-6 border border-gray-700 shadow-xl">
                                <div className="flex items-center gap-2 text-blue-400 mb-4 border-b border-gray-700 pb-2">
                                    <Wrench size={20} />
                                    <h2 className="text-lg font-bold uppercase tracking-wide">Total Buildings</h2>
                                </div>
                                {buildingTotals && buildingTotals.length > 0 ? (
                                    <div className="max-h-48 overflow-y-auto space-y-2 pr-2 scrollbar-thin scrollbar-thumb-gray-600">
                                        {buildingTotals.map(item => (
                                            <div key={item.name} className="flex justify-between items-center text-sm">
                                                <span className="text-gray-300">{item.name}</span>
                                                <span className="text-white font-mono font-bold bg-gray-700 px-2 py-0.5 rounded">
                                                    {Math.ceil(item.count)} <span className="text-gray-500 text-xs">({item.count.toFixed(1)})</span>
                                                </span>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="text-gray-500 italic text-sm">No buildings required.</div>
                                )}
                            </div>

                            {/* Raw Materials Card */}
                            <div className="bg-gray-800 rounded-xl p-6 border border-gray-700 shadow-xl lg:col-span-1">
                                <div className="flex items-center gap-2 text-orange-400 mb-4 border-b border-gray-700 pb-2">
                                    <Layers size={20} />
                                    <h2 className="text-lg font-bold uppercase tracking-wide">Raw Resources</h2>
                                </div>
                                {rawTotals && rawTotals.length > 0 ? (
                                    <div className="max-h-48 overflow-y-auto space-y-2 pr-2 scrollbar-thin scrollbar-thumb-gray-600">
                                        {rawTotals.map(item => (
                                            <div key={item.name} className="flex justify-between items-center text-sm">
                                                <span className="text-gray-300">{item.name}</span>
                                                <span className="text-orange-400 font-mono font-bold">
                                                {item.rate.toLocaleString(undefined, { maximumFractionDigits: 1 })} <span className="text-xs text-gray-500">/min</span>
                                                </span>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="text-gray-500 italic text-sm">No raw resources detected.</div>
                                )}
                            </div>
                        </div>
                        )}

                        {/* Results Area */}
                        <div className="space-y-4">
                            <div className="flex items-center gap-2 text-gray-400 border-b border-gray-700 pb-2">
                                <Package size={18} />
                                <span className="text-sm font-medium uppercase tracking-widest">Production Stack</span>
                            </div>

                            {!treeData && (
                                <div className="text-center py-20 border-2 border-dashed border-gray-800 rounded-xl">
                                    <Settings className="mx-auto text-gray-700 mb-4 animate-spin-slow" size={48} />
                                    <p className="text-gray-500">Select an item and hit Calculate to generate the tree.</p>
                                    {dataStatus === 'error' && (
                                        <p className="text-orange-500 text-sm mt-2 font-medium">Note: Using default data. Ensure recipes.json is in the same folder as index.html.</p>
                                    )}
                                </div>
                            )}

                            {treeData && (
                                <div className="bg-gray-900 rounded-xl overflow-hidden">
                                    <div className="p-2">
                                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 p-3 bg-gray-800 rounded-lg border-l-4 border-orange-500 mb-4">
                                            <div className="flex items-center gap-2">
                                                <span className="font-mono text-xl font-bold text-orange-400">
                                                    {treeData.rate.toLocaleString()}/min
                                                </span>
                                                <span className="text-lg font-bold text-white">
                                                    {treeData.name}
                                                </span>
                                            </div>
                                            
                                            <div className="flex items-center gap-3">
                                                {treeData.machineCount > 0 && (
                                                    <span className="text-gray-400 bg-gray-900/50 px-3 py-1 rounded font-mono border border-gray-700 text-sm flex items-center gap-1">
                                                        <span className="font-bold text-white">{treeData.machineCount.toFixed(2)}x</span> 
                                                        {treeData.machineName || "Mch"}
                                                    </span>
                                                )}

                                                {treeData.power > 0 && (
                                                    <div className="flex items-center gap-1 text-yellow-500 bg-yellow-900/20 px-3 py-1 rounded border border-yellow-800/30 self-start sm:self-auto text-sm">
                                                        <Zap size={16} fill="currentColor" />
                                                        <span className="font-mono font-bold">{treeData.power.toLocaleString(undefined, { maximumFractionDigits: 1 })} MW</span>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                        
                                        <div className="pr-4">
                                            {treeData.children.length > 0 ? (
                                                treeData.children.map((child, idx) => (
                                                    <TreeNode key={`${child.id}-${idx}`} node={child} />
                                                ))
                                            ) : (
                                                <div className="ml-4 flex items-center gap-2 text-red-400 py-2">
                                                    <AlertTriangle size={16} />
                                                    <span>No ingredients or Raw Material.</span>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>

                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
